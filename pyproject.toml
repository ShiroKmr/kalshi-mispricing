[project]
name="kalshi-mispricing"
version="0.1.0"
description="ML-based detection of mispriced Kalshi prediction markets"
readme="README.md"
requires-python=">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini-options]
pythonpath=["src"]
testpaths=["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
